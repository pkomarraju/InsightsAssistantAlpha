[project]
name = "insights-assistant"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "pkomarraju", email = "pkomarraju@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "langgraph-supervisor>=0.0.31",
    "mcp>=2.0.0",
    "numpy>=2.4.6",
    "openai>=2.54.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "uvicorn>=0.52.2",
]

[project.scripts]
insights-assistant = "insights_assistant:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 980" width="1360" height="980" role="img" aria-label="Architecture diagram: a LangGraph supervisor in orchestrator.py delegates to three sub-agents: external_data_agent, internal_data_agent, and relationship_notes_agent, all built with create_agent. All three call a shared mcp_client.py bridge. The bridge reaches the remote EDGAR MCP server over streamable_http for 16 SEC filing tools, spawns internal_data_server.py as a local stdio subprocess exposing 8 tools over 8 Supabase tables protected by row-level security policies for the anon key, and spawns relationship_notes_server.py as a local stdio subprocess exposing one semantic search tool backed by a local FAISS index built from a 50-note JSON corpus. Two Supabase tables, external_signals and insight_ground_truth, have row-level security enabled with no policy at all, so they stay unreachable even via a direct anon-key query, not just because no tool happens to name them. A separate admin-only path using a direct Postgres connection that bypasses row-level security is used offline by setup scripts to create the schema, seed data, and RLS policies, and is never used at agent runtime. A separate legacy script, my_first_agent.py, calls the EDGAR server directly with its own OpenAI client, bypassing the orchestrator entirely.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
          <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#8792a3" />
          </marker>
        </defs>
        <rect x="0" y="0" width="1360" height="980" fill="#ffffff" />

        <g fill="none" stroke="currentColor" color="#435166" stroke-width="1.5" font-family="Menlo, Consolas, 'SF Mono', monospace">

          <!-- ============ LEGACY BRANCH ============ -->
          <g color="#8792a3">
            <rect x="20" y="300" width="190" height="108" rx="3" fill="#f4f6f9" stroke="#8792a3" stroke-dasharray="3 3" />
            <text x="115" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#4a5568">my_first_agent.py</text>
            <text x="115" y="347" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">own OpenAI client</text>
            <text x="115" y="364" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">inline MCP calls</text>
            <text x="115" y="381" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">EDGAR only · standalone</text>

            <path d="M170,408 C 200,450 230,480 260,500" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
            <text x="145" y="452" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">direct call, bypasses</text>
            <text x="145" y="467" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">the supervisor</text>
          </g>

          <!-- ============ MAIN SPINE ============ -->

          <!-- User -->
          <rect x="630" y="18" width="240" height="54" rx="3" fill="#f4f6f9" stroke="#435166" />
          <text x="750" y="52" text-anchor="middle" font-size="13.5" font-family="Helvetica, Arial, sans-serif" fill="#1b2733">user question</text>

          <line x1="750" y1="72" x2="750" y2="106" marker-end="url(#arrow)" />

          <!-- Supervisor -->
          <rect x="560" y="108" width="380" height="70" rx="3" fill="#ffffff" stroke="#435166" stroke-width="2" />
          <text x="750" y="138" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1b2733">orchestrator.py</text>
          <text x="750" y="158" text-anchor="middle" font-size="12.5" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">create_supervisor() — routes and merges 3 agents</text>

          <path d="M655,178 C 545,205 430,220 350,238" marker-end="url(#arrow)" />
          <line x1="750" y1="178" x2="750" y2="238" marker-end="url(#arrow)" />
          <path d="M845,178 C 955,205 1070,220 1150,238" marker-end="url(#arrow)" />
          <text x="420" y="207" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">delegate</text>
          <text x="762" y="207" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">delegate</text>
          <text x="1000" y="207" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">delegate</text>

          <!-- Sub-agents -->
          <rect x="210" y="238" width="280" height="72" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="350" y="269" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">external_data_agent</text>
          <text x="350" y="288" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">create_agent · 16 tools</text>

          <rect x="610" y="238" width="280" height="72" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="750" y="269" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">internal_data_agent</text>
          <text x="750" y="288" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">create_agent · 8 tools</text>

          <rect x="1010" y="238" width="280" height="72" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="1150" y="269" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">relationship_notes_agent</text>
          <text x="1150" y="288" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">create_agent · 1 tool</text>

          <path d="M370,310 C 460,338 560,352 645,372" marker-end="url(#arrow)" />
          <line x1="750" y1="310" x2="750" y2="372" marker-end="url(#arrow)" />
          <path d="M1130,310 C 1040,338 940,352 855,372" marker-end="url(#arrow)" />
          <text x="750" y="349" text-anchor="middle" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">load_tools(server_name)</text>

          <!-- Bridge -->
          <rect x="580" y="372" width="340" height="66" rx="3" fill="#ffffff" stroke="#435166" stroke-width="2" />
          <text x="750" y="402" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1b2733">mcp_client.py</text>
          <text x="750" y="421" text-anchor="middle" font-size="12.5" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">hand-rolled MCP → LangChain bridge</text>

          <path d="M655,438 C 545,465 430,480 350,500" marker-end="url(#arrow)" />
          <line x1="750" y1="438" x2="750" y2="500" marker-end="url(#arrow)" />
          <path d="M845,438 C 955,465 1070,480 1150,500" marker-end="url(#arrow)" />
          <text x="418" y="470" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">streamable_http</text>
          <text x="762" y="470" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">stdio spawn</text>
          <text x="1012" y="470" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">stdio spawn</text>

          <!-- MCP servers -->
          <rect x="210" y="500" width="280" height="78" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="350" y="529" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">EDGAR MCP server</text>
          <text x="350" y="547" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">remote · secedgar.caseyjhand.com</text>
          <text x="350" y="563" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">third party, always on</text>

          <rect x="610" y="500" width="280" height="78" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="750" y="529" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">internal_data_server.py</text>
          <text x="750" y="547" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">local subprocess · reads via anon key</text>
          <text x="750" y="563" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">8 tools, one per table</text>

          <rect x="1010" y="500" width="280" height="78" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="1150" y="529" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">relationship_notes_server.py</text>
          <text x="1150" y="547" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">local subprocess · new</text>
          <text x="1150" y="563" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">search_relationship_notes</text>

          <!-- EDGAR downstream -->
          <line x1="350" y1="578" x2="350" y2="616" marker-end="url(#arrow)" />
          <text x="366" y="601" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">16 tools</text>
          <rect x="230" y="618" width="240" height="56" rx="3" fill="#f4f6f9" stroke="#435166" />
          <text x="350" y="643" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">SEC EDGAR</text>
          <text x="350" y="661" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">live public filings</text>

          <!-- Internal downstream: Supabase container -->
          <rect x="600" y="598" width="300" height="204" rx="4" fill="none" stroke="#8792a3" stroke-dasharray="2 4" />
          <text x="616" y="618" font-size="12.5" font-family="Menlo, Consolas, 'SF Mono', monospace" fill="#4a5568">SUPABASE POSTGRES</text>

          <line x1="750" y1="578" x2="750" y2="636" marker-end="url(#arrow)" />
          <text x="768" y="601" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">8 tools</text>

          <rect x="620" y="638" width="260" height="62" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="750" y="663" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">8 relationship tables</text>
          <text x="750" y="681" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">RLS: anon read · 546 rows</text>

          <rect x="620" y="716" width="260" height="76" rx="3" fill="#ffffff" stroke="#c4622d" stroke-width="2" />
          <text x="750" y="738" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">external_signals +</text>
          <text x="750" y="756" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">insight_ground_truth</text>
          <text x="750" y="775" text-anchor="middle" font-size="11.5" fill="#c4622d" font-family="Helvetica, Arial, sans-serif">RLS: no policy — unreachable</text>

          <!-- Admin-only path into Supabase -->
          <g color="#8792a3">
            <rect x="600" y="848" width="300" height="88" rx="3" fill="#f4f6f9" stroke="#8792a3" stroke-dasharray="3 3" />
            <text x="750" y="872" text-anchor="middle" font-size="13" font-weight="600" fill="#4a5568">admin only · SUPABASE_DB_URL</text>
            <text x="750" y="889" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">sql/*.py — schema, seed, RLS setup</text>
            <text x="750" y="904" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">bypasses RLS · never at agent runtime</text>
            <path d="M750,848 L750,802" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
          </g>

          <!-- relationship_notes downstream: local FAISS -->
          <line x1="1150" y1="578" x2="1150" y2="636" marker-end="url(#arrow)" />
          <text x="1168" y="601" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#4a5568">1 tool</text>

          <rect x="1010" y="638" width="280" height="70" rx="3" fill="#ffffff" stroke="#435166" />
          <text x="1150" y="663" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">FAISS index (local files)</text>
          <text x="1150" y="681" text-anchor="middle" font-size="12" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">.faiss + .metadata.json</text>
          <text x="1150" y="697" text-anchor="middle" font-size="11.5" fill="#4a5568" font-family="Helvetica, Arial, sans-serif">text-embedding-3-small · 1536-dim</text>

          <g color="#8792a3">
            <path d="M1150,796 L1150,708" stroke-dasharray="4 4" marker-end="url(#arrow-muted)" />
            <text x="1150" y="754" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">rag/ingest_relationship_notes.py</text>
            <rect x="1010" y="796" width="280" height="58" rx="3" fill="#f4f6f9" stroke="#8792a3" stroke-dasharray="3 3" />
            <text x="1150" y="820" text-anchor="middle" font-size="13" font-weight="600" fill="#4a5568">relationship_manager_notes.json</text>
            <text x="1150" y="838" text-anchor="middle" font-size="11.5" fill="#8792a3" font-family="Helvetica, Arial, sans-serif">50 notes · source corpus, offline</text>
          </g>

        </g>
      </svg>
